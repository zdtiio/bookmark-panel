name: Build Extension Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: '构建原因'
        required: false
        default: '手动触发构建'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'

      - name: Install dependencies
        working-directory: ./extension
        run: npm ci

      - name: Resolve version
        id: version
        working-directory: ./extension
        run: |
          chrome_version=$(jq -r '.version' manifests/manifest.chrome.json)
          firefox_version=$(jq -r '.version' manifests/manifest.firefox.json)
          if [ "$chrome_version" != "$firefox_version" ]; then
            echo "::error::两份清单版本不一致：chrome=$chrome_version firefox=$firefox_version"
            exit 1
          fi

          # 打 tag 发布时以 tag 版本为准（v1.2.3 → 1.2.3），手动触发时使用清单里的版本
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="$chrome_version" ;;
          esac

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}$'; then
            echo "::error::版本号格式不合法：$version（应为 1 / 1.2 / 1.2.3 形式）"
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "打包版本：$version"

      - name: Build extensions
        working-directory: ./extension
        run: npm run build

      - name: Apply version to built manifests
        working-directory: ./extension
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          for browser in chrome firefox; do
            manifest="dist/$browser/manifest.json"
            jq --arg version "$PACKAGE_VERSION" '.version = $version' "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
            echo "$browser: $(jq -r '.version' "$manifest")"
          done

      - name: Archive Chrome extension
        working-directory: ./extension/dist/chrome
        run: zip -r "../../../bookmark-panel-extension-chrome-${{ steps.version.outputs.value }}.zip" .

      - name: Archive Firefox extension
        working-directory: ./extension/dist/firefox
        run: zip -r "../../../bookmark-panel-extension-firefox-${{ steps.version.outputs.value }}.zip" .

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ steps.version.outputs.value }}
          path: ./bookmark-panel-extension-chrome-${{ steps.version.outputs.value }}.zip

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-${{ steps.version.outputs.value }}
          path: ./bookmark-panel-extension-firefox-${{ steps.version.outputs.value }}.zip

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # actions/checkout 检出 tag 时可能只留下轻量 tag，需重新拉取附注 tag 对象
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          # 以附注 tag 的说明作为 Release 正文
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "${GITHUB_REF_NAME}" > release-notes.md
          fi
          echo "----- 发布说明 -----"
          cat release-notes.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false

      - name: Upload Chrome package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bookmark-panel-extension-chrome-${{ steps.version.outputs.value }}.zip
          asset_name: bookmark-panel-extension-chrome-${{ steps.version.outputs.value }}.zip
          asset_content_type: application/zip

      - name: Upload Firefox package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bookmark-panel-extension-firefox-${{ steps.version.outputs.value }}.zip
          asset_name: bookmark-panel-extension-firefox-${{ steps.version.outputs.value }}.zip
          asset_content_type: application/zip
