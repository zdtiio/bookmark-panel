services:
  bookmark-panel:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bookmark-panel
    ports:
      - "3000:3000"
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
    environment:
      - PORT=3000
      - JWT_SECRET=your-secret-key-change-in-production
      - JWT_EXPIRES_IN=7d
      - DB_PATH=./database/bookmarks.db
      - UPLOAD_PATH=./uploads
    restart: unless-stopped