<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新标签页</title>
  <style>
    body {
      display: none;
      margin: 0;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .time-display {
      text-align: center;
      margin-bottom: 40px;
    }
    .time {
      font-size: 80px;
      font-weight: 300;
      margin-bottom: 10px;
    }
    .date {
      font-size: 20px;
      opacity: 0.7;
    }
    .search-container {
      width: 100%;
      max-width: 600px;
      margin-bottom: 40px;
    }
    .search-input {
      width: 100%;
      padding: 14px 20px;
      font-size: 16px;
      border: none;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      outline: none;
      transition: background 0.3s;
    }
    .search-input:focus {
      background: rgba(255, 255, 255, 0.2);
    }
    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    .quick-actions {
      display: flex;
      gap: 16px;
    }
    .action-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
    * {
      display: none !important;
    }
    body, body > * {
      display: flex !important;
    }
    body {
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .time-display, .search-container, .quick-actions {
      display: block !important;
    }
    .time-display {
      text-align: center;
    }
    .quick-actions {
      display: flex !important;
      gap: 16px;
    }
    .search-input {
      display: block !important;
      width: 100%;
    }
  </style>
  <script>
    (async function() {
      const config = await chrome.storage.local.get(['apiUrl', 'apiToken']);
      if (config.apiToken && config.apiUrl) {
        window.location.href = config.apiUrl;
        return;
      }
      document.body.style.display = 'flex';
      removeChromeElements();
    })();

    function removeChromeElements() {
      setTimeout(() => {
        const elements = document.querySelectorAll('*');
        elements.forEach(el => {
          const ariaLabel = el.getAttribute('aria-label');
          const className = el.className;
          const id = el.id;
          if (
            ariaLabel && (ariaLabel.includes('自定义') || ariaLabel.includes('书签') || ariaLabel.includes('插件')) ||
            className && (className.includes('customize') || className.includes('chrome') || className.includes('extension')) ||
            id && (id.includes('customize') || id.includes('chrome')) ||
            el.textContent && (el.textContent.includes('自定义') || el.textContent.includes('书签管理面板'))
          ) {
            el.style.display = 'none';
            el.style.visibility = 'hidden';
          }
        });
      }, 100);
    }
  </script>
</head>
<body>
  <div class="time-display">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date">----年--月--日</div>
  </div>
  
  <div class="search-container">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索..." />
  </div>
  
  <div class="quick-actions">
    <button class="action-btn" id="saveBtn">保存当前页面</button>
    <button class="action-btn" id="openPanelBtn">打开书签面板</button>
    <button class="action-btn" id="optionsBtn">设置</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
