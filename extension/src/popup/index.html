<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书签面板插件</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: #409eff;
      color: white;
    }
    .btn-secondary {
      background: #f5f5f5;
      color: #666;
    }
    .btn:hover {
      opacity: 0.8;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status.error {
      background: #ffebee;
      color: #c62828;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="width: 24px; height: 24px; background: #409eff; border-radius: 4px;"></div>
    <h2>书签面板</h2>
  </div>
  
  <button class="btn btn-primary" id="saveBtn">保存当前页面</button>
  <button class="btn btn-secondary" id="optionsBtn">设置</button>
  
  <div id="status"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
